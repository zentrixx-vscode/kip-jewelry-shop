<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/catalog.css">
  <title>Товар — DIAMOND ROW</title>
  <style>
.product-detail {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin: 40px 0
    }

    .product-detail__images {
      text-align: center
    }

    .product-detail__main-img {
      max-width: 100%;
      height: auto;
      border-radius: 8px
    }

    .product-detail__info {
      display: flex;
      flex-direction: column;
      gap: 20px
    }

    .product-detail__title {
      font-size: 28px;
      font-weight: 600;
      margin: 0
    }

    .product-detail__brand,
    .product-detail__article {
      color: #666;
      font-size: 14px
    }

    .product-detail__prices {
      display: flex;
      align-items: center;
      gap: 15px
    }

    .product-detail__price {
      font-size: 32px;
      font-weight: 700;
      color: #000
    }

    .product-detail__oldprice {
      font-size: 20px;
      color: #999;
      text-decoration: line-through
    }

    .product-detail__discount {
      background: #ff4444;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600
    }

    .product-detail__stock {
      font-size: 16px;
      font-weight: 600
    }

    .product-detail__stock.in-stock {
      color: #4CAF50
    }

    .product-detail__stock.out-of-stock {
      color: #f44336
    }

    .product-detail__characteristics h3,
    .product-detail__description h3 {
      margin-bottom: 15px;
      font-size: 20px
    }

    .product-specs {
      width: 100%;
      border-collapse: collapse
    }

    .product-specs tr {
      border-bottom: 1px solid #eee
    }

    .product-specs td {
      padding: 10px 0
    }

    .product-specs td:first-child {
      color: #666;
      width: 40%
    }

    .product-detail__actions {
      display: flex;
      gap: 15px;
      margin-top: 20px
    }

    .product-detail__actions .shop-btn {
      flex: 1
    }

    .product-detail__back {
      margin-top: 40px
    }

    .breadcrumbs {
      color: #666;
      font-size: 14px;
      margin: 20px 0
    }

    .breadcrumbs a {
      color: #666;
      text-decoration: none
    }

    .breadcrumbs a:hover {
      text-decoration: underline
    }

    @media (max-width:768px) {
      .product-detail {
        grid-template-columns: 1fr
      }
    }
  </style>
</head>

  <script src="../js/store.js"></script>
  <script src="../js/common.js"></script>
  <script>
    (function () {
      var productId = 28;
      var product = window.DRStore && window.DRStore.getProductById ? window.DRStore.getProductById(productId) : null;

      if (!product) {
        document.getElementById('product-container').innerHTML = '<p>Товар не найден</p>';
        return;
      }

      // Картинки в store.js лежат как "./images/...". На страницах внутри /pages нужен "../images/..."
      var imageSrc = product.image || '';
      if (imageSrc.indexOf('./') === 0) {
        imageSrc = '../' + imageSrc.slice(2);
      }

      var sizeUnit = '';
      if (product.category === 'Кольца') sizeUnit = 'мм (обхват пальца)';
      else if (product.category === 'Серьги' || product.category === 'Подвески') sizeUnit = 'мм (длина)';
      else if (product.category === 'Браслеты' || product.category === 'Цепи') sizeUnit = 'см (длина)';
      else if (product.category === 'Часы') sizeUnit = 'мм (диаметр корпуса)';

      var stockText = (Number(product.stock) || 0) > 0
        ? 'В наличии: ' + product.stock + ' шт.'
        : 'Нет в наличии';

      var stockClass = (Number(product.stock) || 0) > 0 ? 'in-stock' : 'out-of-stock';
      var disabled = (Number(product.stock) || 0) <= 0 ? 'disabled' : '';

      var discount = 0;
      if (Number(product.oldPrice) > 0 && Number(product.price) > 0) {
        discount = Math.round((1 - Number(product.price) / Number(product.oldPrice)) * 100);
        if (!isFinite(discount) || discount < 0) discount = 0;
      }

      var html = '';
      html += '<nav class="breadcrumbs"><a href="../index.html">Главная</a> / <a href="./catalog.html">Каталог</a> / <span>' + product.category + '</span> / <span>' + product.title + '</span></nav>';
      html += '<div class="product-detail">';
      html += '  <div class="product-detail__images"><img src="' + imageSrc + '" alt="' + product.title + '" class="product-detail__main-img"></div>';
      html += '  <div class="product-detail__info">';
      html += '    <h1 class="product-detail__title">' + product.title + '</h1>';
      html += '    <div class="product-detail__brand">Бренд: ' + product.brand + '</div>';
      html += '    <div class="product-detail__article">Артикул: ' + product.article + '</div>';
      html += '    <div class="product-detail__prices">';
      html += '      <span class="product-detail__price">' + window.DRStore.money(product.price) + '</span>';
      html += '      <span class="product-detail__oldprice">' + window.DRStore.money(product.oldPrice) + '</span>';
      html += '      <span class="product-detail__discount">-' + discount + '%</span>';
      html += '    </div>';
      html += '    <div class="product-detail__stock ' + stockClass + '">' + stockText + '</div>';

      html += '    <div class="product-detail__characteristics">';
      html += '      <h3>Характеристики</h3>';
      html += '      <table class="product-specs">';
      html += '        <tr><td>Категория:</td><td><strong>' + product.category + '</strong></td></tr>';
      html += '        <tr><td>Материал:</td><td><strong>' + product.material + '</strong></td></tr>';
      html += '        <tr><td>Проба:</td><td><strong>' + product.probe + '</strong></td></tr>';
      html += '        <tr><td>Вес:</td><td><strong>' + product.weight + ' г</strong></td></tr>';
      html += '        <tr><td>Размер:</td><td><strong>' + product.size + (sizeUnit ? (' ' + sizeUnit) : '') + '</strong></td></tr>';
      html += '      </table>';
      html += '    </div>';

      html += '    <div class="product-detail__actions">';
      html += '      <button class="shop-btn" data-add-to-cart="' + product.id + '" type="button" ' + disabled + '>Добавить в корзину</button>';
      html += '      <button class="shop-iconbtn shop-fav" data-toggle-fav="' + product.id + '" type="button" aria-label="Добавить в избранное">❤</button>';
      html += '    </div>';

      html += '    <div class="product-detail__description">';
      html += '      <h3>Описание</h3>';
      html += '      <p>Украшение из коллекции ' + product.brand + '. ' + product.title + ' выполнено из материала: ' + product.material + ', проба ' + product.probe + '. Вес изделия — ' + product.weight + ' г.</p>';
      html += '      <p>Подойдёт как для повседневных образов, так и в качестве подарка.</p>';
      html += '    </div>';

      html += '  </div>';
      html += '</div>';

      document.getElementById('product-container').innerHTML = html;
      document.title = product.title + ' — DIAMOND ROW';
    })();
  </script>
</body>
